[project]
name = "embedforge"
version = "0.1.0"
description = "Agentic AI workflow for embedded C code generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "EchoSNS" }]
keywords = ["embedded", "code-generation", "llm", "tdd", "firmware", "stm32", "mcu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.7",
    "pydantic>=2.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-c>=0.24.2",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "langchain-community>=0.3",
]
flash = [
    "pyocd>=0.36",
]
vision = [
    "torch>=2.0",
    "open-clip-torch>=2.0",
    "opencv-python>=4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/EchoSNS/embedforge"
Documentation = "https://github.com/EchoSNS/embedforge/tree/main/docs"
Repository = "https://github.com/EchoSNS/embedforge"
Issues = "https://github.com/EchoSNS/embedforge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "config", "plugins", "prompts", "rag", "server", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
