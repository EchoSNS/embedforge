vendor: STMicroelectronics
sdk: STM32F4xx HAL
sdk_version: unknown
supported_families:
- STM32F4xx
peripherals:
  CORE:
    instances: []
    features:
    - Global HAL init/deinit (HAL_Init, HAL_DeInit)
    - MSP hooks for board-level init/deinit (HAL_MspInit, HAL_MspDeInit)
    - System tick/timebase management (InitTick, IncTick, GetTick, Delay, Suspend/Resume
      tick, Set/Get tick frequency and priority)
    - HAL version/device identification (GetHalVersion, GetREVID, GetDEVID)
    notes:
    - HAL_Delay is based on the configured tick source (SysTick by default).
    - Tick priority and frequency can be configured at runtime.
  DBGMCU:
    instances:
    - DBGMCU
    features:
    - 'Control debug behavior in low-power modes: enable/disable debug in SLEEP, STOP,
      STANDBY'
    notes:
    - Altering debug behavior in low-power modes can increase power consumption.
  SYSCFG:
    instances:
    - SYSCFG
    features:
    - I/O compensation cell control (Enable/Disable)
    - Memory bank swapping control (Enable/Disable)
    notes:
    - Compensation cell availability and usage depend on device/package and voltage
      range.
    - Memory bank swapping is only available on devices that implement dual-bank memory.
  UID:
    instances:
    - UID
    features:
    - Read 96-bit unique device ID (GetUIDw0/1/2)
    - Read device and revision IDs (GetDEVID, GetREVID)
    notes:
    - UID values are device-specific and read-only.
  ADC:
    instances:
    - ADC1
    - ADC2
    - ADC3
    features:
    - Initialization/De-initialization with MSP hooks
    - Channel configuration (regular and injected)
    - Blocking conversion (PollForConversion, PollForEvent)
    - Interrupt-driven conversion (Start_IT/Stop_IT with IRQHandler and callbacks)
    - DMA-driven conversion (Start_DMA/Stop_DMA with half/full complete callbacks)
    - Analog watchdog configuration and event callback
    - Injected group conversions (start/stop, polling, interrupt, per-rank readback)
    - Multimode (dual/triple) configuration, DMA start/stop, result retrieval
    - State and error querying (GetState, GetError)
    - User callback registration/unregistration for ADC events
    notes:
    - 'Multimode features require devices with multiple ADCs (typical on STM32F4:
      ADC1/2/3).'
    - DMA usage requires proper DMA channel/stream configuration and linking to ADC
      handle.
    - Injected channels allow precise timing via external triggers; availability and
      number of injected ranks vary by device.
  CAN:
    instances:
    - CAN1
    - CAN2
    features:
    - Initialization/De-initialization with MSP hooks
    - Filter configuration
    - Start/Stop the CAN peripheral
    - Sleep/Wake control with sleep state query
    - Transmit via mailboxes (AddTxMessage) with mailbox status queries
    - Abort pending transmit requests
    - Callback unregistration support
    notes:
    - This is classic bxCAN (not CAN FD).
    - Typical STM32F4 devices integrate two CAN instances; CAN2 clocking depends on
      CAN1.
    - Rx APIs and notification activation exist in the HAL but were not present in
      the provided scan.
  CRC:
    instances:
    - CRC
    features: []
    notes:
    - Type definitions detected (CRC_HandleTypeDef); corresponding HAL CRC functions
      likely available but not present in the provided function list.
  CRYP:
    instances:
    - CRYP
    features: []
    notes:
    - Type definitions detected (CRYP_HandleTypeDef, CRYP_ConfigTypeDef); cryptographic
      accelerator support depends on specific STM32F4 device.
  DAC:
    instances:
    - DAC
    features: []
    notes:
    - Type definitions detected (DAC_ChannelConfTypeDef); DAC availability varies
      across STM32F4 derivatives.
  DCMI:
    instances:
    - DCMI
    features: []
    notes:
    - Type definitions detected (DCMI_HandleTypeDef, DCMI_InitTypeDef); DCMI presence
      depends on specific STM32F4 variants.
  CEC:
    instances:
    - CEC
    features: []
    notes:
    - Callback ID types detected; CEC peripheral support varies by device.
  DFSDM:
    instances:
    - DFSDM
    features: []
    notes:
    - Type definitions detected (DFSDM_Channel_* and DFSDM_Filter_*); DFSDM is only
      present on select STM32 families/variants and may not apply to all STM32F4 devices.
patterns:
  init_sequence:
  - 'System: HAL_Init -> HAL_MspInit -> (configure system clock/timebase) -> optionally
    HAL_InitTick'
  - 'ADC (polling): HAL_ADC_Init -> HAL_ADC_ConfigChannel -> HAL_ADC_Start -> HAL_ADC_PollForConversion
    -> HAL_ADC_GetValue -> HAL_ADC_Stop'
  - 'ADC (interrupt): HAL_ADC_Init -> HAL_ADC_ConfigChannel -> HAL_ADC_Start_IT ->
    (in IRQ) HAL_ADC_IRQHandler -> user callbacks (ConvCplt/LevelOutOfWindow/Error)
    -> HAL_ADC_Stop_IT'
  - 'ADC (DMA): HAL_ADC_Init -> HAL_ADC_ConfigChannel -> HAL_ADC_Start_DMA -> (callbacks:
    ConvHalfCplt/ConvCplt) -> HAL_ADC_Stop_DMA'
  - 'ADC (injected): HAL_ADC_Init -> HAL_ADCEx_InjectedConfigChannel -> HAL_ADCEx_InjectedStart
    / HAL_ADCEx_InjectedStart_IT -> HAL_ADCEx_InjectedGetValue -> HAL_ADCEx_InjectedStop'
  - 'ADC (multimode): HAL_ADC_Init (master/slave) -> HAL_ADCEx_MultiModeConfigChannel
    -> HAL_ADCEx_MultiModeStart_DMA -> HAL_ADCEx_MultiModeGetValue -> HAL_ADCEx_MultiModeStop_DMA'
  - 'CAN: HAL_CAN_Init -> HAL_CAN_ConfigFilter -> HAL_CAN_Start -> HAL_CAN_AddTxMessage
    -> (optional) HAL_CAN_IsTxMessagePending / HAL_CAN_GetTxMailboxesFreeLevel ->
    HAL_CAN_Stop'
  naming_conventions:
    module_prefix: HAL_<PERIPH>_Action for basic APIs; HAL_<PERIPH>Ex_* for extended
      features
    lifecycle: '*Init / *DeInit for peripheral setup and tear-down; *MspInit / *MspDeInit
      for low-level IO/clock/NVIC'
    operation_modes: '*Start / *Stop for basic; *Start_IT / *Stop_IT for interrupt
      mode; *Start_DMA / *Stop_DMA for DMA mode; PollFor* for blocking'
    irq: HAL_<PERIPH>_IRQHandler called from the actual IRQ handler
    callbacks: <PERIPH>_<Event>Callback weak functions; RegisterCallback/UnRegisterCallback
      APIs when callback registration is enabled
    types: <PERIPH>_HandleTypeDef for runtime context; <PERIPH>_InitTypeDef and other
      *ConfTypeDef for configuration structures
    getters_setters: Get*/Set* for status, errors, configuration and ID registers
  error_handling:
  - Most APIs return HAL_StatusTypeDef (HAL_OK, HAL_ERROR, HAL_BUSY, HAL_TIMEOUT);
    check return values.
  - Use HAL_<PERIPH>_GetError to retrieve detailed error bitfields when available.
  - Blocking PollFor* APIs take a Timeout; handle HAL_TIMEOUT return and ensure tick
    is running.
  - In interrupt mode, ensure HAL_<PERIPH>_IRQHandler is called from the ISR and use
    *_Callback hooks for event processing.
  - DMA operations rely on DMA callbacks (half/full complete, error); ensure DMA is
    configured and linked to the peripheral handle.
constraints:
- Peripheral and feature availability varies by specific STM32F4 device/line (not
  all parts have CAN2, DCMI, DAC, CRYP, DFSDM, etc.).
- ADC multimode features require multiple ADC instances; injected channels and analog
  watchdog capabilities vary by device.
- ADC DMA usage requires a properly configured DMA stream/channel and linking via
  handle before Start_DMA.
- Callback registration/unregistration APIs typically require enabling USE_HAL_<PERIPH>_REGISTER_CALLBACKS
  in HAL configuration.
- CAN2 operation depends on CAN1 clocking; filters should be configured before starting
  the CAN peripheral.
- HAL_Delay and PollFor* use the HAL tick; avoid using in ISRs and ensure tick is
  active (not suspended) or use timeouts carefully.
- Enabling debug in low-power modes (DBGMCU) halts certain peripherals and increases
  power consumption.
- I/O compensation cell and memory bank swapping are only functional on devices that
  implement these SYSCFG features; enabling them outside valid conditions has no effect.
- Tick priority affects interrupt latency; ensure HAL_InitTick priority is set appropriately
  for the application.
