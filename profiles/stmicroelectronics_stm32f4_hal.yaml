vendor: STMicroelectronics
sdk: STM32F4 HAL
sdk_version: unknown
supported_families:
- STM32F4
peripherals:
  HAL_CORE:
    instances:
    - HAL
    features:
    - Global HAL initialization and de-initialization (HAL_Init/HAL_DeInit)
    - MSP hook entry points for board-level setup (HAL_MspInit/HAL_MspDeInit)
    - HAL version retrieval (HAL_GetHalVersion)
    notes:
    - Call HAL_Init early in main before configuring peripherals.
    - MSP functions are weak and intended to be overridden by the user to enable clocks,
      NVIC and GPIO.
  SYSTICK:
    instances:
    - SysTick
    features:
    - Tick base initialization (HAL_InitTick)
    - Increment and millisecond delay (HAL_IncTick, HAL_Delay)
    - Get tick count and priority (HAL_GetTick, HAL_GetTickPrio)
    - Configurable tick frequency (HAL_SetTickFreq/HAL_GetTickFreq)
    - Suspend/Resume tick (HAL_SuspendTick/HAL_ResumeTick)
    notes:
    - SysTick provides the default HAL timebase used by HAL_Delay and timeouts.
    - Changing tick priority/frequency affects timing of all HAL timeouts.
  DBGMCU:
    instances:
    - DBGMCU
    features:
    - Read device and revision IDs (HAL_GetDEVID, HAL_GetREVID)
    - Control debug behavior in low-power modes (Enable/Disable DBGSleep/DBGStop/DBGStandby)
    notes:
    - Enabling debug in low-power modes increases power consumption and should be
      used only during development.
  SYSCFG:
    instances:
    - SYSCFG
    features:
    - I/O compensation cell control (HAL_EnableCompensationCell/HAL_DisableCompensationCell)
    - Memory bank swapping control (HAL_EnableMemorySwappingBank/HAL_DisableMemorySwappingBank)
    notes:
    - Compensation cell availability depends on device variant; SYSCFG clock must
      be enabled before use.
    - Memory bank swapping is only present on dual-bank devices; affects boot memory
      mapping.
  UID:
    instances:
    - UID
    features:
    - Read 96-bit unique device ID (HAL_GetUIDw0/HAL_GetUIDw1/HAL_GetUIDw2)
    notes:
    - Unique ID registers are read-only and device-specific.
  ADC:
    instances:
    - ADC1
    - ADC2
    - ADC3
    features:
    - Initialization/De-initialization with MSP hooks (HAL_ADC_Init/HAL_ADC_DeInit,
      HAL_ADC_MspInit/HAL_ADC_MspDeInit)
    - Callback registration/unregistration (HAL_ADC_RegisterCallback/HAL_ADC_UnRegisterCallback)
    - 'Regular conversion control: start/stop, polling with timeout (HAL_ADC_Start/Stop,
      HAL_ADC_PollForConversion)'
    - Event polling (HAL_ADC_PollForEvent)
    - Interrupt-driven conversions (HAL_ADC_Start_IT/HAL_ADC_Stop_IT, HAL_ADC_IRQHandler)
    - DMA-driven conversions (HAL_ADC_Start_DMA/HAL_ADC_Stop_DMA)
    - Read latest conversion result (HAL_ADC_GetValue)
    - Channel configuration (HAL_ADC_ConfigChannel)
    - Analog watchdog configuration (HAL_ADC_AnalogWDGConfig)
    - Status and error reporting (HAL_ADC_GetState/HAL_ADC_GetError)
    - 'Regular conversion callbacks: complete, half-complete, watchdog, error (HAL_ADC_ConvCpltCallback,
      HAL_ADC_ConvHalfCpltCallback, HAL_ADC_LevelOutOfWindowCallback, HAL_ADC_ErrorCallback)'
    - 'Injected group conversions: start/stop/poll, IT variants, read injected rank
      value (HAL_ADCEx_InjectedStart/Stop/PollForConversion, HAL_ADCEx_InjectedStart_IT/Stop_IT,
      HAL_ADCEx_InjectedGetValue)'
    - Injected channel configuration and callback (HAL_ADCEx_InjectedConfigChannel,
      HAL_ADCEx_InjectedConvCpltCallback)
    - Multi-mode (dual/triple) configuration and operation (HAL_ADCEx_MultiModeConfigChannel,
      HAL_ADCEx_MultiModeStart_DMA/Stop_DMA, HAL_ADCEx_MultiModeGetValue)
    notes:
    - Enable ADC and GPIO clocks and configure analog input pins in HAL_ADC_MspInit.
    - For DMA operation, configure and link a DMA stream to the ADC handle before
      calling HAL_ADC_Start_DMA.
    - In multi-mode, ADC1 typically acts as the master; ensure common ADC configuration
      is set appropriately.
    - Provide the ADC IRQ handler (HAL_ADC_IRQHandler) in the corresponding ISR when
      using interrupts.
    - Use polling (blocking), IT, or DMA variants exclusively per conversion stream
      to avoid conflicts.
  CAN:
    instances:
    - CAN1
    - CAN2
    features:
    - Initialization/De-initialization with MSP hooks (HAL_CAN_Init/HAL_CAN_DeInit,
      HAL_CAN_MspInit/HAL_CAN_MspDeInit)
    - Callback registration support (HAL_CAN_UnRegisterCallback; registration available
      when enabled at compile time)
    - Filter configuration (HAL_CAN_ConfigFilter)
    - Start/Stop the CAN peripheral (HAL_CAN_Start/HAL_CAN_Stop)
    - Sleep/Wakeup control and sleep status query (HAL_CAN_RequestSleep/HAL_CAN_WakeUp/HAL_CAN_IsSleepActive)
    - 'Transmit mailbox management: add message, abort, query free level and pending
      status (HAL_CAN_AddTxMessage, HAL_CAN_AbortTxRequest, HAL_CAN_GetTxMailboxesFreeLevel,
      HAL_CAN_IsTxMessagePending)'
    notes:
    - Configure GPIOs for CAN TX/RX and enable peripheral clocks in HAL_CAN_MspInit.
    - Configure at least one filter before starting reception.
    - bxCAN supports classic CAN frames up to 8 bytes (no CAN FD).
    - There are 3 transmit mailboxes; check availability before queueing.
    - On devices with CAN2, it depends on CAN1 clocking; ensure CAN1 is enabled.
  CRC:
    instances:
    - CRC
    features:
    - Hardware CRC computation engine (types indicate handle and state support)
    notes:
    - CRC HAL APIs are available in the SDK; enable CRC clock before use.
  CRYP:
    instances:
    - CRYP
    features:
    - On-chip cryptographic processor support (config, handle, state, callback ID
      types present)
    - Callback registration mechanism indicated by HAL_CRYP_CallbackIDTypeDef
    notes:
    - Actual supported algorithms depend on device variant; refer to device RM.
  DAC:
    instances:
    - DAC1
    features:
    - Digital-to-Analog Converter with channel configuration (DAC_ChannelConfTypeDef)
    - State and callback ID support
    notes:
    - Configure analog output pins and clocks in MSP init before DAC operations.
  DCMI:
    instances:
    - DCMI
    features:
    - Digital Camera Interface (init and sync code types present)
    - State and callback ID support for frame/capture events
    notes:
    - Availability depends on specific STM32F4 subfamily; ensure proper GPIO and clock
      setup.
  DFSDM:
    instances:
    - DFSDM1
    features:
    - 'Digital Filter for Sigma-Delta Modulators: channel and filter parameter types
      present'
    - Regular and injected filter parameterization support indicated by types
    notes:
    - Only available on specific STM32F4 variants; consult the datasheet.
  CEC:
    instances:
    - CEC
    features:
    - Consumer Electronics Control peripheral (callback ID type present)
    notes:
    - Feature presence varies by device; use BSP references for supported pins.
  MPU:
    instances:
    - MPU
    features:
    - MPU region initialization structure present (MPU_Region_InitTypeDef)
    notes:
    - MPU configuration is part of system setup and not tied to a specific peripheral
      instance.
patterns:
  init_sequence:
  - Call HAL_Init to reset peripherals, initialize the Flash interface and the SysTick.
  - Configure the system clock (user-defined SystemClock_Config).
  - Enable peripheral clocks and configure GPIO/alternate functions in HAL_*_MspInit.
  - Populate *InitTypeDef structures and call HAL_<PERIPH>_Init.
  - Apply additional configuration via HAL_<PERIPH>_Config* APIs as needed.
  - Start operations using HAL_<PERIPH>_Start, or enable interrupt/DMA variants with
    HAL_<PERIPH>_Start_IT / HAL_<PERIPH>_Start_DMA.
  - In ISRs, call HAL_<PERIPH>_IRQHandler and implement weak callbacks (e.g., HAL_<PERIPH>_ConvCpltCallback)
    to handle events.
  - Use HAL_GetTick/HAL_Delay for timing and respect tick frequency/priority settings.
  naming_conventions:
    function_prefix: HAL_<PERIPH>_* for standard APIs; HAL_<PERIPH>Ex_* for extended/advanced
      features
    variants: Blocking (no suffix), interrupt (_IT), and DMA (_DMA) variants indicate
      transfer method
    irq_handler: HAL_<PERIPH>_IRQHandler to be called from the peripheral's ISR
    msp: HAL_<PERIPH>_MspInit / HAL_<PERIPH>_MspDeInit for low-level hardware setup
    types_handle: '*_HandleTypeDef holds peripheral instance, init params, DMA/lock
      state'
    types_init: '*_InitTypeDef for initialization parameters; *_ConfTypeDef for per-channel/per-feature
      configuration'
    types_state: HAL_*_StateTypeDef enumerations for driver state
    callbacks: HAL_*_CallbackIDTypeDef enumerates callback IDs for registration APIs
  error_handling:
  - 'Most HAL APIs return HAL_StatusTypeDef: HAL_OK, HAL_ERROR, HAL_BUSY, or HAL_TIMEOUT.'
  - Polling APIs accept a Timeout parameter; use HAL_MAX_DELAY for indefinite wait
    when supported.
  - Query error details via HAL_<PERIPH>_GetError and driver state via HAL_<PERIPH>_GetState
    when available.
  - Interrupt/DMA paths require proper NVIC configuration and calling HAL_<PERIPH>_IRQHandler
    inside the ISR.
  - Callback registration functions return status and require corresponding compile-time
    enable macros.
constraints:
- HAL_Init must be called before using most HAL peripherals and services (tick, delays).
- MSP init functions must enable clocks and configure GPIO alternate functions; failing
  to do so will cause peripheral init to fail.
- ADC DMA transfers require a properly configured DMA stream/channel linked to the
  ADC handle prior to HAL_ADC_Start_DMA.
- ADC multi-mode features require multiple ADC instances present; ADC1 typically acts
  as the master controller.
- ADC injected and regular conversions are controlled independently but may have trigger/resource
  constraints depending on the device.
- Analog watchdog operates on configured channels and thresholds; not all channels
  may be eligible on all devices.
- 'CAN on STM32F4 uses bxCAN: classic CAN only (max 8 data bytes per frame, no CAN
  FD).'
- Configure at least one CAN filter before starting reception; otherwise no frames
  will be accepted.
- CAN has 3 TX mailboxes; check availability with HAL_CAN_GetTxMailboxesFreeLevel
  to avoid transmission failures.
- On devices with CAN2, it depends on CAN1 clocking; ensure CAN1 is enabled for CAN2
  operation.
- SysTick drives HAL timeouts and HAL_Delay; modifying tick frequency or priority
  affects timing across the HAL.
- Enabling DBGMCU debug in low-power modes prevents full entry into those modes and
  increases current consumption.
- Memory bank swapping control is only effective on devices supporting dual-bank flash
  memory.
- SYSCFG compensation cell is not available on all variants and requires the SYSCFG
  clock to be enabled.
- Unique ID registers are read-only; use HAL_GetUIDw0/w1/w2 to fetch the 96-bit identifier.
- Callback registration APIs are available only when USE_HAL_<PERIPH>_REGISTER_CALLBACKS
  is enabled in the HAL configuration.
- For interrupt-driven operations, the user must implement the weak callback functions
  to handle events.
clock_tree: {}
