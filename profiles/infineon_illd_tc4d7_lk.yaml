vendor: Infineon
sdk: iLLD TC4D7_LK
sdk_version: unspecified
supported_families:
- AURIX TC4x (TC4D7)
peripherals:
  ADC:
    instances:
    - TMADC
    - CDSP
    features:
    - Module and per-submodule configuration via initModuleConfig/initModule patterns
    - 'TMADC: channel, group and monitor-channel configuration and triggering'
    - 'TMADC: boundary and EMUX configuration'
    - 'TMADC: per-channel event enable with selectable service request node and event
      type'
    - 'TMADC: software trigger for group/channel/monitor channel'
    - 'TMADC: result acquisition with timestamp readout'
    - 'TMADC: result availability flags, clearable result flags'
    - 'TMADC: result buffering (setup result buffer, write buffer), circular buffer
      access and result count queries'
    - 'TMADC: ISR hooks for channel and group results'
    - 'CDSP: DSP core configuration and initialization per core'
    - 'CDSP: multi-core enable/disable (bitmask-based)'
    - 'CDSP: secondary/tertiary result reads and main DSP core results'
    - 'CDSP: timestamp counter control (start/stop/read value and counter)'
    - 'CDSP: integrator intermediate value read'
    - 'CDSP: buffer control (clear, is full/empty) and sample count queries'
    - 'CDSP: stream result read with status return and configurable result buffer'
    - 'CDSP: ISR hook for DSP results'
    notes:
    - Configuration helpers require an Ifx_ADC base pointer to bind defaults to the
      specific ADC instance.
    - "Service request (interrupt) selection is exposed in API; map chosen nodes to\
      \ the platform\u2019s interrupt controller."
    - Result and timestamp widths are reflected by return types (e.g., timestamps
      as uint16); handle wrap-around accordingly.
    - Result buffer APIs imply interrupt-driven or polled streaming; ensure buffer
      lifetime and size are adequate for ISR usage.
  EGTM:
    instances:
    - ATOM
    - TOM
    - TIM
    - CDTM
    - HRPWM
    features:
    - Pin mapping for ATOM/TOM TOUT outputs with configurable port output mode and
      pad driver
    - Pin mapping for TIM TIN inputs with configurable port input mode
    - CDTM input mapping including selection of DTM auxiliary input
    - HRPWM output pin mapping with output mode and pad driver selection
    notes:
    - "PinMap_set... functions both select the EGTM signal routing and configure the\
      \ corresponding port\u2019s electrical characteristics."
    - Available TIN/TOUT/HRPWM/CDTM mappings are device-specific; choose from the
      provided map types for TC4D7.
  AccessProtection:
    instances:
    - ACCEN/APU
    features:
    - Direct configuration of access enable write/read registers (A/B variants)
    - Enable/disable master read and write permissions by TagId
    - Virtual machine (VM) read/write access configuration and per-VM enable/disable
    - PRS (process/resource) read/write access configuration and per-PRS enable/disable
    - Region protection via lower/upper address register programming
    - Raw register setters for VM and PRS composite registers
    notes:
    - APU/ACCEN APIs operate on volatile, memory-mapped registers; ensure proper privilege
      level and locking when changing access controls.
    - "TagId/VM/PRS identifiers must match the platform\u2019s master and virtualization/resource\
      \ mapping."
  GPIO_PinMux:
    instances:
    - Port pins used by EGTM (TOUT/TIN/HRPWM/CDTM)
    features:
    - Port output mode and pad driver selection for mapped outputs
    - Port input mode selection for mapped inputs
    notes:
    - Pin electrical configuration is applied as part of EGTM pin mapping calls; ensure
      the chosen mode matches the signal direction.
patterns:
  init_sequence:
  - Obtain default configuration using init...Config (e.g., IfxAdc_Tmadc_initModuleConfig
    or IfxAdc_Cdsp_initDspCoreConfig) with the peripheral base pointer.
  - Adjust configuration fields as needed for the application.
  - Initialize the peripheral or submodule using init... (e.g., IfxAdc_Tmadc_initModule,
    IfxAdc_Tmadc_initGroup, IfxAdc_Tmadc_initChannel, IfxAdc_Cdsp_initDspCore).
  - 'For ADC TMADC: configure boundary/EMUX as required; enable events and select
    service request nodes.'
  - Set up result buffers if streaming is required (setup...ResultBuffer), then enable/trigger
    acquisitions (runModule/triggerGroup/triggerChannel).
  - Handle results either by polling (isResultAvailable/is...Buffer... queries) or
    via ISR hooks (result...Isr).
  - 'For ADC CDSP: optionally enable multiple DSP cores, manage timestamp counters,
    and use stream/circular buffer APIs for result handling.'
  - 'For EGTM pins: apply PinMap_set... to route signals and configure port modes/pad
    drivers before enabling the functional module.'
  naming_conventions:
    module_prefix: Ifx<Peripheral>_<Submodule>_<action> (e.g., IfxAdc_Tmadc_initChannel,
      IfxEgtm_PinMap_setTomTout)
    config_structs: Types ending with _Config (e.g., IfxAdc_Tmadc_ChConfig) are filled
      by init...Config helpers.
    instances: 'Sub-entities abbreviated in names: Ch (Channel), Group, MonitorCh,
      Dsp (DSP core).'
    actions: init..., configure..., enable/disable..., trigger..., read/write...,
      is... (boolean query), clear... (flag reset), result...Isr (ISR entry).
    pinmap: Pin routing functions start with IfxEgtm_PinMap_set... and accept IfxPort_*
      mode/driver enums.
  error_handling:
  - Check functions returning IfxAdc_Status (e.g., setup/read stream operations) and
    handle non-success codes.
  - Use is... queries (e.g., isResultAvailable, isBufferFull/Empty) before reading
    or writing buffers to avoid underrun/overrun.
  - Clear result flags after processing data using clear...Flag APIs to re-arm events.
  - Size and bounds-check result buffers; use getNumberOf... APIs to dimension reads
    and prevent overflow.
  - For timestamp counters and 16-bit reads, handle wrap-around conditions in application
    logic.
constraints:
- Always call init...Config to obtain device-appropriate defaults before init... to
  the hardware.
- "Event/interrupt handling requires mapping the selected service request node to\
  \ a valid ISR and priority in the platform\u2019s interrupt controller."
- Result buffers provided to setup...ResultBuffer must remain valid for the lifetime
  of acquisitions and ISR usage.
- Timestamp and certain counters are 16-bit per the API return types; implement rollover
  handling.
- CDSP multi-core enable uses a bitmask; only bits corresponding to available DSP
  cores on the device have effect.
- "Pin mappings are limited to the device\u2019s available TIN/TOUT/HRPWM/CDTM pins;\
  \ select from the provided Map types for TC4D7."
- ACCEN/APU register writes affect system-wide access permissions; ensure proper privilege
  level and avoid race conditions when updating regions and masks.
- Direct register arguments (volatile Ifx_* types) must point to valid memory-mapped
  registers for the active device instance.
